status.poll.period.seconds=5

# Speech Recognition Model Configuration
asr.provider=qwen
model.enabled=false
model.path=src/main/resources/models
model.type=STREAMING_PARAFORMER
tokens.path=tokens.txt
num_threads=4
sample_rate=16000

# Qwen3-ASR cloud provider. The API key remains DPAPI-encrypted under LOCALAPPDATA.
qwen.api.base=https://llm-hwf94vqt8ppb7bv1.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions
qwen.model=qwen3-asr-flash-2026-02-10
qwen.key.path=AristAIControl/dashscope.key
qwen.enable_itn=true
qwen.glossary=AhaKey,Arist,Arist.ai,Codex,Claude,Cursor,ChatGPT,Gemini,OpenAI,GPT,API,MCP,PowerShell,GitHub
qwen.terminology.path=AristAIControl/terminology.txt
qwen.corrections.path=AristAIControl/corrections.tsv
qwen.correction.min_confidence=0.98

# Low-cost, non-thinking pass that lightly cleans final transcript text.
# It reuses the same DPAPI-encrypted DashScope key configured above.
qwen.polish.api.base=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
qwen.polish.model=qwen-flash
qwen.polish.timeout.seconds=8
qwen.polish.temperature=0.1
qwen.polish.max.output.tokens=512
voice.auto_start=true

# VAD (Voice Activity Detection) Configuration
vad.enabled=false
vad.model.path=src/main/resources/models/silero_vad.onnx
